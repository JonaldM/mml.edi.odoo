[pytest]
# importlib mode lets pytest collect tests inside packages with dots in their
# directory names (e.g. mml.edi) without trying to execute the Odoo-dependent
# package __init__.py files during collection.
#
# testpaths: restrict collection to tests/ so pytest never tries to walk the
# root __init__.py (which has Odoo relative imports).
addopts = --import-mode=importlib --ignore=__init__.py
testpaths = tests
